name: ${COMPOSE_PROJECT_NAME:-gestao-afastados}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      POSTGRES_DB: ${POSTGRES_DB:-gestao_afastados}
      POSTGRES_USER: ${POSTGRES_USER:-gestao_afastados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao_afastados_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [app]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gestao_afastados}:${POSTGRES_PASSWORD:-gestao_afastados_local}@db:5432/${POSTGRES_DB:-gestao_afastados}?schema=public
      SESSION_COOKIE_NAME: mcm_afastados_session
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_SECONDS: 28800
      SESSION_TOUCH_INTERVAL_SECONDS: 300
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_IDS: ${MICROSOFT_TENANT_IDS:-}
      MICROSOFT_REDIRECT_URI: http://localhost:3000/api/v1/auth/callback
      MICROSOFT_ALLOWED_EMAIL_DOMAINS: mcm.eng.br,mcmmontagens.com.br
      APDATA_BASE_URL: ${APDATA_BASE_URL:-}
      APDATA_CLIENT_ID: ${APDATA_CLIENT_ID:-}
      APDATA_CLIENT_SECRET: ${APDATA_CLIENT_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/storage
      MAX_UPLOAD_BYTES: 10485760
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - uploads_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [app]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_APP_NAME: MCM Gestão de Afastados
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/health.html').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [app]

volumes:
  db_data:
  uploads_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  app:
    driver: bridge
