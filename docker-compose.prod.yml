name: ${COMPOSE_PROJECT_NAME:-gestao-afastamento}
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: runtime
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      NODE_ENV: production
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Defina FRONTEND_ORIGIN no ambiente de producao}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no ambiente de producao}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mcm_gestao_afastamento_session}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no ambiente de producao}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:?Defina MICROSOFT_CLIENT_ID no ambiente de producao}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:?Defina MICROSOFT_CLIENT_SECRET no ambiente de producao}
      MICROSOFT_TENANT_IDS: ${MICROSOFT_TENANT_IDS:?Defina MICROSOFT_TENANT_IDS no ambiente de producao}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:?Defina MICROSOFT_REDIRECT_URI no ambiente de producao}
      MICROSOFT_ALLOWED_EMAIL_DOMAINS: mcm.eng.br,mcmmontagens.com.br
      APDATA_BASE_URL: ${APDATA_BASE_URL:-}
      APDATA_CLIENT_ID: ${APDATA_CLIENT_ID:-}
      APDATA_CLIENT_SECRET: ${APDATA_CLIENT_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /app/storage
      AZURE_STORAGE_NAME: ${AZURE_STORAGE_NAME:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-gestao-afastamento}
      MAX_UPLOAD_BYTES: 10485760
      RUN_SEED_ON_DEPLOY: ${RUN_SEED_ON_DEPLOY:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/storage
    networks:
      app:
        aliases:
          - gestao-afastamento-backend
      coolify:
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/db').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
      - coolify
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/health.html"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
volumes:
  uploads_data:
networks:
  app:
    driver: bridge
  coolify:
    external: true
    name: coolify
