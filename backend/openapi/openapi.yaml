          type: array
          items:
            type: object
            required: [id, type, title, message, isOverdue, isRead, dueDate, context, readAt]
            properties:
              id: {type: string}
              type:
                type: string
                enum: [BENEFICIO_VENCIDO, BENEFICIO_A_VENCER, RETORNO_VENCIDO, RETORNO_PREVISTO, PROXIMA_ACAO_VENCIDA, PROXIMA_ACAO]
