      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [indicators, activeByObra, newLeavesByMonth, duration, priorities]
          properties:
            indicators:
              type: object
              required: [activeLeaves, expiredBenefits, expectedReturnsNext15Days]
              properties:
                activeLeaves: {type: integer, minimum: 0}
                expiredBenefits: {type: integer, minimum: 0}
                expectedReturnsNext15Days: {type: integer, minimum: 0}
            activeByObra:
              type: array
