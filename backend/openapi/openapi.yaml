      additionalProperties: false
      properties: { nome: { type: string }, classificacao: { type: string, enum: [ATIVO, ENCERRADO, APOSENTADO] } }
    LeaveStatusUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties: { nome: { type: string }, ativo: { type: boolean }, classificacao: { type: string, enum: [ATIVO, ENCERRADO, APOSENTADO] } }
    EmployeeWrite:
