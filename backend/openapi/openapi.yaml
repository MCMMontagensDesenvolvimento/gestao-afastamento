      properties: { name: { type: string, minLength: 2, maxLength: 200 }, email: { type: string, format: email }, isActive: { type: boolean, default: true } }
    RoleWrite:
      type: object
      required: [code, name]
      additionalProperties: false
      properties: { code: { type: string }, name: { type: string }, description: { type: string }, isActive: { type: boolean, default: true } }
