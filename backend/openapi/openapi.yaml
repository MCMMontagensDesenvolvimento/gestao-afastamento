      additionalProperties: false
      properties: { codigoCorporativo: { type: string }, nome: { type: string }, contato: { type: string }, obraId: { type: string, format: uuid }, funcaoId: { type: string, format: uuid } }
    EmployeeUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties: { nome: { type: string }, contato: { type: [string, 'null'] }, obraId: { type: string, format: uuid }, funcaoId: { type: string, format: uuid } }
    LeaveWrite:
      type: object
      required: [colaboradorId, obraId, funcaoId, situacaoId, dataAfastamento]
