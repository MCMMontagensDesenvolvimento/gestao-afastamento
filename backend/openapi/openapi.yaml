                required: [obraId, obraNome, total]
                properties:
                  obraId: {type: string, format: uuid}
                  obraNome: {type: string}
                  total: {type: integer, minimum: 0}
            newLeavesByMonth:
              type: array
              items:
                type: object
                required: [month, total]
                properties:
                  month: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
                  total: {type: integer, minimum: 0}
            duration:
              type: object
              required: [status, series]
              properties:
                status: {const: pending_final_validation}
                series: {type: array, maxItems: 0}
            priorities:
              type: array
              items:
                type: object
                required: [type, dueDate, isOverdue, afastamentoId, colaboradorId, colaboradorNome]
                properties:
                  type:
                    type: string
                    enum: [BENEFICIO, RETORNO]
                  dueDate: {type: string, format: date}
                  isOverdue: {type: boolean}
                  afastamentoId: {type: string, format: uuid}
                  colaboradorId: {type: string, format: uuid}
                  colaboradorNome: {type: string}
