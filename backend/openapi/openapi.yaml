      type: object
      minProperties: 1
      additionalProperties: false
      properties: { name: { type: string }, description: { type: [string, 'null'] }, isActive: { type: boolean } }
    CatalogWrite: { type: object, required: [nome], additionalProperties: false, properties: { nome: { type: string, minLength: 2, maxLength: 200 } } }
