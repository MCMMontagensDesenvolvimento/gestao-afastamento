        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/permissoes:
    get:
      tags: [Acessos]
      x-permission: permissions.manage
      summary: Lista catálogo imutável de capabilities
      responses:
        '200': {$ref: '#/components/responses/PermissionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/obras:
    get:
      tags: [Cadastros]
      x-permission: settings.manage
      summary: Lista itens ativos e inativos com paginação
