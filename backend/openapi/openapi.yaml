openapi: 3.1.0
info: {title: MCM Gestão de Afastados API, version: 0.2.0, description: 'API interna. Datas civis usam YYYY-MM-DD e timestamps usam ISO 8601 UTC.
    Entradas textuais são aparadas quando definido no schema de validação. O backend envia X-Request-ID em todas as respostas e aceita um identificador
    de correlação com 1–128 caracteres alfanuméricos, ponto, hífen ou sublinhado. Erros seguem ApiError; corpos JSON têm limite de 1 MiB. x-permission
    com uma lista exige todas as capabilities. A proteção do último administrador preserva ao menos um usuário ativo cuja união de papéis ativos
    inclui session.access e permissions.manage.'}
servers:
- {url: 'http://localhost:3000', description: Desenvolvimento local}
security:
- sessionCookie: []
tags:
- {name: Autenticação}
- {name: Acessos}
- {name: Cadastros}
- {name: Colaboradores}
- {name: Afastamentos}
- {name: Andamentos}
- {name: Documentos}
- {name: Notificações}
- {name: Dashboard}
- {name: Auditoria}
paths:
  /health:
    get:
      security: []
      tags: [Autenticação]
      summary: Liveness
      responses:
        '200':
          description: Serviço ativo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
  /health/db:
    get:
      security: []
      tags: [Autenticação]
      summary: Readiness do PostgreSQL
      responses:
        '200':
          description: Banco acessível
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/login:
    get:
      security: []
      tags: [Autenticação]
      summary: Inicia Authorization Code Flow Microsoft com PKCE
      parameters:
      - name: returnTo
        in: query
        schema: {type: string}
        description: Rota interna sem controles, barras invertidas nem origem externa; padrão /.
      responses:
        '302':
          description: Redirecionamento para o Microsoft Entra ID
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '422':
          description: Entrada inválida; navegação HTML recebe mensagem amigável e link para retornar ao login.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
            text/html:
              schema: {type: string}
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '503':
          description: Microsoft não configurado ou indisponível; preserva status e requestId em JSON ou página HTML amigável.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
            text/html:
              schema: {type: string}
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/callback:
    get:
      security: []
      tags: [Autenticação]
      summary: Valida callback OIDC, cria sessão local e redireciona
      parameters:
      - name: code
        in: query
        schema: {type: string}
      - name: state
        in: query
        schema: {type: string}
      - name: error
        in: query
        schema: {type: string}
      responses:
        '302':
          description: Redirecionamento interno após sucesso ou falha tratada
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/me:
    get:
      tags: [Autenticação]
      x-permission: session.access
      summary: Sessão, papéis e capabilities atuais
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthMeResponse'}
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/logout:
    post:
      tags: [Autenticação]
      x-permission: session.access
      summary: Revoga a sessão corrente e limpa o cookie
      responses:
        '204':
          description: Sessão revogada
          headers:
            X-Request-ID:
              description: Identificador de correlação
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/usuarios:
    get:
      tags: [Acessos]
      x-permission: users.read
      summary: Lista usuários locais
      parameters:
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      - {$ref: '#/components/parameters/Search'}
      - name: ativo
        in: query
        schema: {type: boolean}
      - name: roleId
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/UserWithRelationsPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Acessos]
      x-permission: users.manage
      summary: Pré-cadastra usuário corporativo, sem senha
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreate'}
      responses:
        '201': {$ref: '#/components/responses/UserItem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/usuarios/{id}:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Acessos]
      x-permission: users.read
      summary: Obtém usuário e seus papéis
      responses:
        '200': {$ref: '#/components/responses/UserWithRelationsItem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Acessos]
      x-permission: users.manage
      summary: Atualiza o nome local do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 2, maxLength: 200}
              minProperties: 1
      responses:
        '200': {$ref: '#/components/responses/UserItem'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/usuarios/{id}/ativar:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Acessos]
      x-permission: users.manage
      summary: Ativa usuário
      responses:
        '200': {$ref: '#/components/responses/UserItem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/usuarios/{id}/inativar:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Acessos]
      x-permission: users.manage
      summary: Inativa usuário e revoga suas sessões
      responses:
        '200': {$ref: '#/components/responses/UserItem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/usuarios/{id}/papeis:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Acessos]
      x-permission: permissions.manage
      summary: Substitui papéis do usuário em transação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              additionalProperties: false
              properties:
                roleIds:
                  type: array
                  items: {type: string, format: uuid}
                  maxItems: 100
                  description: Duplicatas são desconsideradas; lista vazia remove vínculos respeitando a proteção do último administrador.
      responses:
        '200': {$ref: '#/components/responses/UserWithRelationsItem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/papeis:
    get:
      tags: [Acessos]
      x-permission: users.read
      summary: Lista papéis e permissões
      responses:
        '200': {$ref: '#/components/responses/RoleList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Acessos]
      x-permission: permissions.manage
      summary: Cria papel configurável; SMS permanece bloqueado
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleWrite'}
      responses:
        '201': {$ref: '#/components/responses/RoleItem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/papeis/{id}:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Acessos]
      x-permission: permissions.manage
      summary: Edita ou inativa papel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleUpdate'}
      responses:
        '200': {$ref: '#/components/responses/RoleItem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/papeis/{id}/permissoes:
    parameters:
    - {$ref: '#/components/parameters/Id'}
    put:
      tags: [Acessos]
      x-permission: permissions.manage
      summary: Substitui capabilities do papel em transação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
