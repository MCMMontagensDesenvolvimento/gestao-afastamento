        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: mcm_afastados_session, description: 'Cookie HttpOnly com token opaco; somente o hash SHA-256
        é persistido. Nome padrão mostrado; SESSION_COOKIE_NAME pode configurá-lo. Secure obrigatório em produção; SameSite configurável, padrão
        Lax.'}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        enum: [10, 20, 50, 100]
        default: 10
    Search:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    SortDirection:
      name: sortDirection
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    Unauthorized:
      description: Sem sessão válida
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
      headers:
        X-Request-ID:
          description: Identificador de correlação
          schema: {type: string}
    Forbidden:
      description: Capability insuficiente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
      headers:
        X-Request-ID:
          description: Identificador de correlação
          schema: {type: string}
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
      headers:
        X-Request-ID:
          description: Identificador de correlação
          schema: {type: string}
    Conflict:
      description: Duplicidade ou conflito de estado, incluindo remoção do último administrador com session.access e permissions.manage.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
      headers:
        X-Request-ID:
          description: Identificador de correlação
          schema: {type: string}
    ValidationError:
      description: Entrada ou regra inválida
      content:
        application/json:
