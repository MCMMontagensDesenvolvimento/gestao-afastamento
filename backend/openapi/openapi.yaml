      properties:
        colaboradorId: { type: string, format: uuid }
        obraId: { type: string, format: uuid }
        funcaoId: { type: string, format: uuid }
        situacaoId: { type: string, format: uuid }
        tipoBeneficioId: { type: [string, 'null'], format: uuid }
        dataAfastamento: { type: string, format: date }
        dataFimBeneficio: { type: [string, 'null'], format: date }
        dataRetornoPrevista: { type: [string, 'null'], format: date }
        dataRetornoEfetiva: { type: [string, 'null'], format: date }
        causaCid: { type: [string, 'null'] }
        observacoes: { type: [string, 'null'] }
    LeaveUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        colaboradorId: { type: string, format: uuid }
        obraId: { type: string, format: uuid }
        funcaoId: { type: string, format: uuid }
        situacaoId: { type: string, format: uuid }
        tipoBeneficioId: { type: [string, 'null'], format: uuid }
        dataAfastamento: { type: string, format: date }
        dataFimBeneficio: { type: [string, 'null'], format: date }
        dataRetornoPrevista: { type: [string, 'null'], format: date }
        dataRetornoEfetiva: { type: [string, 'null'], format: date }
        causaCid: { type: [string, 'null'] }
        observacoes: { type: [string, 'null'] }
    ProgressWrite:
      type: object
      required: [tipoAndamentoId, dataAndamento, descricao]
      additionalProperties: false
      properties: { tipoAndamentoId: { type: string, format: uuid }, dataAndamento: { type: string, format: date }, descricao: { type: string }, proximaAcao: { type: [string, 'null'] }, dataProximaAcao: { type: [string, 'null'], format: date } }
    ProgressUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties: { tipoAndamentoId: { type: string, format: uuid }, dataAndamento: { type: string, format: date }, descricao: { type: string }, proximaAcao: { type: [string, 'null'] }, dataProximaAcao: { type: [string, 'null'], format: date } }
    DeleteReason: { type: object, additionalProperties: false, properties: { reason: { type: string, minLength: 2, maxLength: 500 } } }
    NotificationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, type, title, message, isOverdue, isRead, dueDate, context]
            properties:
              id: { type: string }
              type: { type: string }
              title: { type: string }
              message: { type: string }
              isOverdue: { type: boolean }
              isRead: { type: boolean }
              readAt: { type: [string, 'null'], format: date-time }
              dueDate: { type: string, format: date }
              context: { type: object, required: [afastamentoId, colaboradorId], properties: { afastamentoId: { type: string, format: uuid }, colaboradorId: { type: string, format: uuid } } }
        meta: { type: object, required: [unreadCount], properties: { unreadCount: { type: integer } } }
    DashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [indicators, activeByObra, newLeavesByMonth, duration, priorities]
          properties:
            indicators:
              type: object
              required: [activeLeaves, expiredBenefits, expectedReturnsNext15Days]
              properties:
                activeLeaves: { type: integer }
                expiredBenefits: { type: integer }
                expectedReturnsNext15Days: { type: integer }
            activeByObra: { type: array, items: { type: object } }
            newLeavesByMonth: { type: array, items: { type: object } }
            duration: { type: object, required: [status, series], properties: { status: { const: pending_final_validation }, series: { type: array, maxItems: 0 } } }
            priorities: { type: array, items: { type: object } }
